[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Workspace automation tasks (install, …) for git-remote-object-store"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Mirror the workspace policy: `.claude/rules/rust.md` bans `panic!` /
# `unreachable!()` in non-test code; encoding the rule as a lint catches
# regressions at compile time.
unreachable = "deny"

[dependencies]
# Ergonomic error reporting with context — xtask is an internal tool, so
# `anyhow` is the right fit (no need for typed errors that downstream
# crates would match on).
anyhow = "1"

# `xtask man` builds the clap `Command` for the management CLI and walks
# its subcommands. `string` enables `impl From<String> for clap::builder::Str`
# so freshly-formatted subcommand names (e.g. `git-remote-object-store-doctor`)
# can be fed to `Command::name` without leaking a `'static` string.
clap = { version = "4", features = ["derive", "string"] }
clap_mangen = "0.2"

# Source of truth for the management-CLI clap definition. Reusing the
# same `Cli` type the binary parses guarantees `xtask man` cannot drift
# from the binary's option surface.
git-remote-object-store-cli = { path = "../cli" }

# `xtask man --check` renders into a scratch directory and diffs the
# result against the checked-in `man/` tree. tempfile is the dev-dep
# the install module already pulled in for its unit tests; promoting
# it to a regular dependency lets the `man` runtime use it too.
tempfile = "3"

[dev-dependencies]
# Scratch directories for the symlink-refresh unit tests.
tempfile = "3"
