[package]
name = "git-remote-object-store-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "Git remote helper binaries (git-remote-s3+https, git-remote-az+https, …) and LFS custom-transfer agent backed by cloud object stores"
repository = "https://github.com/dekobon/git-remote-object-store"
homepage = "https://github.com/dekobon/git-remote-object-store"
readme = "../README.md"
keywords = ["git", "remote-helper", "s3", "azure", "lfs"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[lib]
name = "git_remote_object_store_cli"
path = "src/lib.rs"

# Remote-helper shims. Git invokes them by scheme as `git-remote-<scheme>`,
# so the installed binary names must be `git-remote-s3+https` etc.
#
# cargo rejects `+` in `[[bin]] name` ("invalid character '+' in crate name").
# Falling back to hyphenated cargo bin names; `cargo xtask install`
# (see `xtask/src/install.rs`) creates the `+`-form symlinks git looks
# up by URL scheme. Packagers do the same step in their post-install
# hooks — see the `post_install_script` / `maintainer-scripts` blocks
# in the package-metadata tables further down.

[[bin]]
name = "git-remote-s3-https"
path = "src/bin/git-remote-s3-https.rs"

[[bin]]
name = "git-remote-s3-http"
path = "src/bin/git-remote-s3-http.rs"

[[bin]]
name = "git-remote-az-https"
path = "src/bin/git-remote-az-https.rs"

[[bin]]
name = "git-remote-az-http"
path = "src/bin/git-remote-az-http.rs"

[[bin]]
name = "git-remote-object-store"
path = "src/bin/git-remote-object-store.rs"

[[bin]]
name = "git-lfs-object-store"
path = "src/bin/git-lfs-object-store.rs"

[features]
# Enables the RustFS-backed integration tests in `tests/s3_store_integration.rs`.
# Requires Docker on the host running `cargo test --features integration-s3`.
integration-s3 = []

# Enables the Azurite-backed integration tests in
# `tests/azure_store_integration.rs`. Requires Docker on the host running
# `cargo test --features integration-azure`.
integration-azure = []

[dependencies]
# `version` is required for crates.io publish — `cargo publish` rewrites
# the path dep to use the registry version, but it refuses to package
# unless the manifest declares one. Local builds still resolve via
# `path`; the version is consulted only by the registry.
git-remote-object-store = { path = "..", version = "0.1.0" }

# Async runtime — needed for #[tokio::main] macro resolution and for
# tokio::io (BufReader, stdin, stdout) in the LFS binary. `signal` is
# required by install_sigpipe_mask() in lib.rs (Unix only).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "signal",
] }

# CLI arg parsing — management binary only.
clap = { version = "4", features = ["derive"] }

# Git repository discovery — git-remote-object-store.rs and
# git-lfs-object-store.rs call gix::discover() directly.
gix = "0.83"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Re-declare the lib crate with `test-util` enabled so the integration
# tests in `cli/tests/` pick up `git_remote_object_store::test_util`
# (shared `git`, `git_capture`, `drive_in`, `make_seed_repo` helpers).
# Cargo unifies the feature set across the two dep tables, so the
# release binaries built from `[dependencies]` do not link the
# test-util module — only the test build does.
git-remote-object-store = { path = "..", features = ["test-util"] }

# `async_trait::async_trait` proc macro — required by the
# `cli/tests/common/zip_fault.rs` `ZipPutFaultStore` decorator's
# `impl ObjectStore for ...` (the trait is declared with the same
# macro, so impls outside the lib crate need it too). Pinned to the
# same major version the library crate uses.
async-trait = "0.1"

# AWS config — `tests/s3_store_integration.rs` builds `aws_config::defaults`
# directly for the S3 client setup. The library enables additional features
# (`credentials-login` for IAM Identity Center support) via the workspace
# `Cargo.toml`; cargo unifies features across the workspace, so this
# dev-dep does not need to mirror the full set — only the features the
# integration tests use directly.
aws-config = { version = "1", features = ["behavior-version-latest"] }

# Bytes — imported directly in integration tests for object assertions.
bytes = "1"

# Time — used in both integration test files for HTTP date header formatting.
# Must match the library's feature set.
time = { version = "0.3", features = ["parsing", "formatting"] }

# URL — `tests/azure_store_integration.rs` uses `::url::Url::parse` for
# endpoint construction in the signed HTTP helper functions.
url = "2"

# Temporary directories — used by the git CLI integration section of
# the integration tests to create isolated repo trees.
tempfile = "3"

# SHA-256 — used in both integration test files for content-hash assertions.
sha2 = "0.10"

# JSON parsing — `tests/packchain_live_*.rs` parse `chain.json` /
# `path-index.json` to assert the packchain on-bucket layout (#69).
serde_json = "1"

# AWS SDK S3 — `tests/s3_store_integration.rs` imports `ByteStream` directly.
# Versions and features must match the library's `[dependencies]` entry so
# cargo unifies to a single copy.
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }

# Azure core — `tests/azure_store_integration.rs` imports `Method` and
# header types directly for the one-off container-setup HTTP call.
azure_core = "0.35"

# HTTP client — `tests/azure_store_integration.rs` builds a `reqwest::Client`
# for the signed container-setup request. Must match the library's feature set.
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "rustls",
] }

# Testcontainers — shared across both integration test files. `blocking`
# enables `SyncRunner` (starts containers outside any tokio runtime so they
# survive across `#[tokio::test]`-spawned runtimes). `http_wait_plain` enables
# the HTTP health-poll wait strategy used by the RustFS fixture.
testcontainers = { version = "0.27", features = [
  "blocking",
  "http_wait_plain",
] }

# ---------------------------------------------------------------------
# Native-package metadata (rendered into .deb / .rpm at release time).
# ---------------------------------------------------------------------
#
# Asset paths are byte-identical to where smoke tests under the same
# OS family look, so a packaging change can never silently desync the
# install layout from the verification step.
#
# `name` is overridden to drop the `-cli` suffix — the package surface
# users `apt install` / `dnf install` is just `git-remote-object-store`.
# Every binary the CLI builds ships in the same package; the hyphenated
# `git-remote-s3-https` etc. names are what cargo emits, and the
# `+`-form names git invokes are produced by post-install hardlinks
# (see `maintainer-scripts`).

[package.metadata.deb]
name = "git-remote-object-store"
maintainer = "Elijah Zupancic <elijah@zupancic.name>"
copyright = "2026 Elijah Zupancic; Apache-2.0"
license-file = ["../LICENSE", "0"]
extended-description = """\
Git remote helper that exposes AWS S3 and Azure Blob Storage as git \
remotes. Push, fetch, and clone Git repositories straight against a \
bucket or container — no server, no SaaS, no managed runner. Ships \
the helper-protocol binaries (git-remote-s3+https, git-remote-az+https, \
…), an LFS custom-transfer agent, and a management CLI for bucket \
inspection and ref protection.\
"""
section = "vcs"
priority = "optional"
depends = "git"
assets = [
  [
    "target/release/git-remote-s3-https",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/git-remote-s3-http",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/git-remote-az-https",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/git-remote-az-http",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/git-remote-object-store",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/git-lfs-object-store",
    "usr/bin/",
    "755",
  ],
  [
    "../README.md",
    "usr/share/doc/git-remote-object-store/README.md",
    "644",
  ],
  [
    "../CHANGELOG.md",
    "usr/share/doc/git-remote-object-store/CHANGELOG.md",
    "644",
  ],
  [
    "../THIRD-PARTY-LICENSES.md",
    "usr/share/doc/git-remote-object-store/THIRD-PARTY-LICENSES.md",
    "644",
  ],
  # Manpages — clap-derived for the management CLI + its subcommands,
  # hand-authored stubs for the helper-protocol and LFS binaries. The
  # glob keeps the asset list stable as subcommands come and go; CI
  # enforces that `man/` matches `cargo xtask man --check`.
  [
    "../man/*.1",
    "usr/share/man/man1/",
    "644",
  ],
]
maintainer-scripts = "../packaging/debian/"

[package.metadata.generate-rpm]
name = "git-remote-object-store"
license = "Apache-2.0"
summary = "Git remote helper backed by cloud object stores (S3, Azure Blob)"
assets = [
  { source = "target/release/git-remote-s3-https", dest = "/usr/bin/git-remote-s3-https", mode = "755" },
  { source = "target/release/git-remote-s3-http", dest = "/usr/bin/git-remote-s3-http", mode = "755" },
  { source = "target/release/git-remote-az-https", dest = "/usr/bin/git-remote-az-https", mode = "755" },
  { source = "target/release/git-remote-az-http", dest = "/usr/bin/git-remote-az-http", mode = "755" },
  { source = "target/release/git-remote-object-store", dest = "/usr/bin/git-remote-object-store", mode = "755" },
  { source = "target/release/git-lfs-object-store", dest = "/usr/bin/git-lfs-object-store", mode = "755" },
  { source = "../README.md", dest = "/usr/share/doc/git-remote-object-store/README.md", mode = "644", doc = true },
  { source = "../CHANGELOG.md", dest = "/usr/share/doc/git-remote-object-store/CHANGELOG.md", mode = "644", doc = true },
  { source = "../THIRD-PARTY-LICENSES.md", dest = "/usr/share/doc/git-remote-object-store/THIRD-PARTY-LICENSES.md", mode = "644", doc = true },
  { source = "../LICENSE", dest = "/usr/share/licenses/git-remote-object-store/LICENSE", mode = "644", doc = true },
  # Manpages — see the matching block under `[package.metadata.deb]`.
  { source = "../man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
]
# `auto-req = "no"` disables `%find-requires` ldd-based scanning of the
# packaged binaries. Our binaries are static rust ELFs (no dynamic
# system libraries beyond glibc, which is implicit on every supported
# RHEL-family target), so the `Requires:` set is fully captured by
# the explicit `[..requires]` table below. If a future contributor
# adds a runtime C dep (e.g. a libssl or libpcre system call), revisit
# this — auto-req would have caught it and suggested an explicit
# Requires:.
auto-req = "no"

# Symlink the `+`-form remote-helper names that git invokes directly.
# Cargo cannot ship a binary whose name contains `+`, so the package
# installs the hyphenated names and creates the `+`-form symlinks
# post-install (and removes them on uninstall).
#
# Source of truth for the (cargo-name, plus-name) pairs is the
# `HELPER_PAIRS` const in `xtask/src/install.rs`. The
# `packaging_sync` unit tests there will fail on drift. Keep these
# scripts and their siblings in sync:
#   packaging/debian/postinst         (deb post-install)
#   packaging/debian/prerm            (deb pre-remove)
#   packaging/alpine/APKBUILD.in      (Alpine package() hardlinks)
#   packaging/homebrew/git-remote-object-store.rb.tmpl (Homebrew install)
post_install_script = '''
ln -sf /usr/bin/git-remote-s3-https /usr/bin/git-remote-s3+https
ln -sf /usr/bin/git-remote-s3-http  /usr/bin/git-remote-s3+http
ln -sf /usr/bin/git-remote-az-https /usr/bin/git-remote-az+https
ln -sf /usr/bin/git-remote-az-http  /usr/bin/git-remote-az+http
'''
post_uninstall_script = '''
rm -f /usr/bin/git-remote-s3+https /usr/bin/git-remote-s3+http \
      /usr/bin/git-remote-az+https /usr/bin/git-remote-az+http
'''

[package.metadata.generate-rpm.requires]
git = "*"
